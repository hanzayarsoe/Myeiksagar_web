<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz · Myeiksagar</title>
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='images/favicon.ico') }}"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,500&family=Noto+Sans+Myanmar:wght@400;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/myeiksagar.css') }}"
    />
    <script>
      let timeLeft = 30;

      function updateTimer() {
        document.getElementById("timer").innerHTML = timeLeft + " seconds";
        if (timeLeft == 0) {
          handleTimeout();
        } else {
          timeLeft--;
          setTimeout(updateTimer, 1000);
        }
      }

      function handleTimeout() {
        const form = document.querySelector("form");
        const selectedOption = form.querySelector(
          'input[name="answer"]:checked'
        );

        if (!selectedOption) {
          const firstOption = form.querySelector('input[name="answer"]');
          if (firstOption) firstOption.checked = true;
        }

        form.submit();
      }

      window.onload = updateTimer;
    </script>
  </head>
  <body>
    <main class="ms-main--center">
      <div class="ms-quiz-shell">
        <p class="ms-kicker">Quiz</p>
        <h2>Question {{ question_number }} / {{ total_questions }}</h2>
        <div
          class="ms-progress"
          style="width: {{ (question_number / total_questions) * 100 }}%;"
        ></div>
        <div class="ms-timer">Time left: <span id="timer">30 seconds</span></div>
        <form method="POST">
          <div class="ms-question">{{ question }}</div>
          <ul class="ms-options">
            {% for option in options %}
            <li>
              <label>
                <input type="radio" name="answer" value="{{ option }}" required />
                <span>{{ option }}</span>
              </label>
            </li>
            {% endfor %}
          </ul>
          <button type="submit" class="ms-btn ms-btn--primary ms-btn--block">
            Submit
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
