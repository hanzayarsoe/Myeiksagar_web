<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Congratulations · Myeiksagar</title>
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='images/favicon.ico') }}"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,500&family=Noto+Sans+Myanmar:wght@400;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/myeiksagar.css') }}"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
  </head>
  <body>
    <div id="confetti"></div>
    <main class="ms-main--center">
      <div class="ms-quiz-shell" id="congratsCard">
        <p class="ms-kicker">ဘိတ်စကား</p>
        <h1>Congratulations!</h1>
        <p style="text-align: center; color: var(--ms-label); margin: 0 0 1.5rem">
          You've completed all levels of the quiz. Well done!
        </p>
        <a href="{{ url_for('index') }}" class="ms-btn ms-btn--accent ms-btn--lg ms-btn--block">
          Back to home
        </a>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioContext = new AudioContext();

      function playAudio() {
        fetch("{{ url_for('static', filename='sounds/congratulation.mp3') }}")
          .then((response) => response.arrayBuffer())
          .then((arrayBuffer) => audioContext.decodeAudioData(arrayBuffer))
          .then((audioBuffer) => {
            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);
            source.start(0);
          })
          .catch((error) => console.error("Error with audio playback:", error));
      }

      playAudio();
      document.body.addEventListener(
        "click",
        function () {
          if (audioContext.state === "suspended") {
            audioContext.resume().then(() => playAudio());
          }
        },
        { once: true }
      );

      function triggerConfetti() {
        confetti({
          particleCount: 120,
          spread: 90,
          origin: { y: 0.6 },
          colors: ["#163528", "#2A8A84", "#1A4549", "#E6E8E2"],
        });
      }
      triggerConfetti();
      setInterval(triggerConfetti, 3000);

      gsap.from("#congratsCard h1", {
        opacity: 0,
        scale: 0.85,
        duration: 0.9,
        ease: "elastic.out(1, 0.55)",
      });
      gsap.from("#congratsCard p, #congratsCard a", {
        opacity: 0,
        y: 28,
        duration: 0.7,
        ease: "power2.out",
        stagger: 0.12,
        delay: 0.2,
      });
    </script>
  </body>
</html>
